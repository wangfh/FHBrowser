<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" role="img" aria-label="FHBrowser">
  <title>FHBrowser</title>
  <desc>蓝色渐变圆角底 + 白色 FH 连字：F 竖与 H 左竖共用，中横贯通；F 上横与 H 右竖之间保留负空间。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#0B57D0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="196" fill="url(#bg)"/>
  <g fill="#FFFFFF">
    <!-- 左竖：F 竖 / H 左竖 -->
    <rect x="302" y="320" width="105" height="383"/>
    <!-- F 上横（与 H 右竖之间留出 48 单位负空间） -->
    <rect x="302" y="320" width="268" height="105"/>
    <!-- 中横：F 与 H 共用，贯通到右竖 -->
    <rect x="302" y="459" width="421" height="105"/>
    <!-- H 右竖 -->
    <rect x="618" y="320" width="105" height="383"/>
  </g>
</svg>